# ── Font ────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        20.00

# ── Colors (minimal black/mono) ─────────────────────────
background            #0a0a0a
foreground            #cfcfcf
cursor                #ffffff
cursor_text_color     #0a0a0a
selection_background  #2a2a2a
selection_foreground  #ffffff

color0   #0a0a0a
color8   #4a4a4a
color1   #c05050
color9   #d07070
color2   #b0b0b0
color10  #d0d0d0
color3   #909090
color11  #b8b8b8
color4   #808080
color12  #a0a0a0
color5   #a8a8a8
color13  #c8c8c8
color6   #989898
color14  #bcbcbc
color7   #cfcfcf
color15  #ffffff

# ── Transparency & blur ─────────────────────────────────
background_opacity     0.85
background_blur        20

# ── Window / padding ────────────────────────────────────
window_padding_width   16
window_margin_width     0
hide_window_decorations yes
confirm_os_window_close 0

# ── Cursor ──────────────────────────────────────────────
cursor_shape            beam
cursor_beam_thickness   1.8
cursor_blink_interval   0.5
cursor_stop_blinking_after 15.0

# ── Scrollback ──────────────────────────────────────────
scrollback_lines        10000

# ── Bell ────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.0

# ── Misc polish ─────────────────────────────────────────
repaint_delay           8
input_delay             2
sync_to_monitor         yes
