# Monitors
monitor = eDP-1, 1920x1080, 0x0, 1
#monitor=HDMI-A-1,1920x1080@60,1920x0,1
monitor=HDMI-A-1,1920x1080@60,0x0,1,mirror,eDP-1

# Set programs that you use
$terminal = kitty
$browser = firefox

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

## Keyboard layout

input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = -0.3

    touchpad {
        natural_scroll = false
    }
    kb_options = caps:escape
}

gesture = 3, horizontal, workspace


### KEYBINDINGS 

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, A, exec, $menu
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, L, exec, hyprlock -q
bind = $mainMod, F, exec, firefox
bind = $mainMod, K, exec, keepassxc
bind = $mainMod, D, exec, discord
bind = $mainMod, O, exec, obsidian

bind = $mainMod, P, exec, flameshot gui -c
bind = $mainMod SHIFT, P, exec, flameshot screen -c


bind = $mainMod, B, fullscreen

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, ampersand, workspace, 1
bind = $mainMod, eacute, workspace, 2
bind = $mainMod, quotedbl, workspace, 3
bind = $mainMod, apostrophe, workspace, 4
bind = $mainMod, parentleft, workspace, 5
bind = $mainMod, minus, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, ampersand, movetoworkspace, 1
bind = $mainMod SHIFT, eacute, movetoworkspace, 2
bind = $mainMod SHIFT, quotedbl, movetoworkspace, 3
bind = $mainMod SHIFT, apostrophe, movetoworkspace, 4
bind = $mainMod SHIFT, parentleft, movetoworkspace, 5
bind = $mainMod SHIFT, minus, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

binde = $mainMod SHIFT, left,  resizeactive, -30 0
binde = $mainMod SHIFT, right, resizeactive,  30 0
binde = $mainMod SHIFT, up,    resizeactive,  0 -30
binde = $mainMod SHIFT, down,  resizeactive,  0  30

bind = $mainMod ALT, left,  moveactive, -30 0
bind = $mainMod ALT, right, moveactive,  30 0
bind = $mainMod ALT, up,    moveactive,  0 -30
bind = $mainMod ALT, down,  moveactive,  0  30


# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-


windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
